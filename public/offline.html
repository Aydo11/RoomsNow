<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1666AA">
<title>You're offline | RoomsNow</title>
<style>
  :root { --bg: #f5f8fb; --card: #ffffff; --ink: #14202e; --soft: #4a5a6c; --pine: #1666AA; --line: #dde5ee; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d141c; --card: #152130; --ink: #eef3f8; --soft: #a9b8c8; --pine: #549DE5; --line: #253447; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 32px 24px; text-align: center; }
  .icon { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 16px; background: #171F2E; display: grid; place-items: center; }
  h1 { font-size: 24px; line-height: 1.2; margin: 0 0 8px; }
  p { margin: 0 0 20px; color: var(--soft); }
  button { font: inherit; font-weight: 600; min-height: 46px; padding: 0 22px; border: 0; border-radius: 10px; background: var(--pine); color: #fff; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--pine); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">
    <svg viewBox="0 0 48 48" width="36" height="36"><path d="M24 6 L44 22 V40 H4 V22 Z" fill="white"/><rect x="12" y="28" width="8" height="12" rx="1" fill="#1666AA"/><circle cx="35" cy="30" r="7" stroke="#549DE5" stroke-width="3" fill="#171F2E"/><line x1="40.2" y1="35.2" x2="44.5" y2="39.5" stroke="#549DE5" stroke-width="3" stroke-linecap="round"/></svg>
  </div>
  <h1>You're offline</h1>
  <p>RoomsNow needs the internet to show rooms that are free right now. Check your signal or Wi-Fi, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
